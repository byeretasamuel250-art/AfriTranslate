<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriTranslate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>AfriTranslate</h1>
  <p class="subtitle">Translate between African languages</p>

  <div class="lang-row">
    <select id="srcLang">
      <option value="eng">English</option>
      <option value="lug">Luganda</option>
      <option value="swa">Swahili</option>
      <option value="nyn">Runyankole</option>
      <option value="kin">Kinyarwanda</option>
    </select>

    <button id="swapBtn" title="Swap languages">&#8646;</button>

    <select id="tgtLang">
      <option value="lug">Luganda</option>
      <option value="eng">English</option>
      <option value="swa">Swahili</option>
      <option value="nyn">Runyankole</option>
      <option value="kin">Kinyarwanda</option>
    </select>
  </div>

  <div class="box">
    <textarea id="inputText" rows="3" placeholder="Type or speak here..."></textarea>
    <div class="box-actions">
      <button id="micBtn" title="Speak">&#127908;</button>
    </div>
  </div>

  <button id="translateBtn" class="primary-btn">Translate</button>
  <p id="errorMsg" class="error"></p>

  <div class="box output-box">
    <p id="outputText" class="placeholder">Translation will appear here</p>
    <div class="box-actions">
      <button id="speakBtn" title="Listen">&#128266;</button>
      <button id="copyBtn" title="Copy">&#128203;</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
