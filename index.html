<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AfriTranslate</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="header-row">
    <img src="logo.svg" alt="AfriTranslate logo" class="logo">
    <h1>AfriTranslate</h1>
  </div>

  <!-- Login / register screen - shown first, until someone signs in -->
  <div id="authScreen">
    <p class="subtitle">learn new language</p>
    <input type="text" id="authName" class="auth-input" placeholder="Your name" autocomplete="username">
    <input type="email" id="authEmail" class="auth-input" placeholder="Email (for further classes)" autocomplete="email" style="display:none;">
    <div class="password-wrapper">
      <input type="password" id="authPassword" class="auth-input" placeholder="6-character password" maxlength="6" autocomplete="current-password">
      <button type="button" id="authPasswordPeek" class="peek-btn" title="Show password briefly">&#128065;</button>
    </div>
    <p id="authError" class="error"></p>
    <button id="loginBtn" class="primary-btn">Log In</button>
    <button id="registerBtn" class="primary-btn secondary-btn" style="display:none;">Create Account</button>
    <button id="authModeToggle" class="logout-link">New here? Register</button>
    <button id="forgotPasswordLink" class="logout-link">Forgot password?</button>
  </div>

  <!-- Shown when someone clicks "Forgot password?" - just needs their name -->
  <div id="forgotScreen" style="display:none;">
    <p class="subtitle">Reset your password</p>
    <input type="text" id="forgotName" class="auth-input" placeholder="Your name" autocomplete="username">
    <p id="forgotError" class="error"></p>
    <p id="forgotSuccess" class="success" style="display:none;">Check your email for a reset link.</p>
    <button id="sendResetBtn" class="primary-btn">Send Reset Link</button>
    <button id="backToLoginBtn" class="logout-link">Back to log in</button>
  </div>

  <!-- Shown after someone clicks the reset link in their email -->
  <div id="resetScreen" style="display:none;">
    <p class="subtitle">Choose a new password</p>
    <div class="password-wrapper">
      <input type="password" id="newPassword" class="auth-input" placeholder="New 6-character password" maxlength="6">
      <button type="button" id="newPasswordPeek" class="peek-btn" title="Show password briefly">&#128065;</button>
    </div>
    <p id="resetError" class="error"></p>
    <button id="setNewPasswordBtn" class="primary-btn">Set New Password</button>
  </div>

  <!-- Main translator screen - hidden until signed in -->
  <div id="appScreen" style="display:none;">
    <p class="subtitle">Translate between African languages</p>

    <div class="lang-row">
      <select id="srcLang">
        <option value="eng">English</option>
        <option value="lug">Luganda</option>
        <option value="swa">Swahili</option>
        <option value="nyn">Runyankole</option>
        <option value="kin">Kinyarwanda</option>
        <option value="ach">Acholi</option>
        <option value="teo">Ateso</option>
        <option value="lgg">Lugbara</option>
        <option value="xog">Lusoga</option>
        <option value="ttj">Rutooro</option>
        <option value="nyo">Runyoro</option>
        <option value="cgg">Rukiga</option>
        <option value="koo">Rukonjo</option>
        <option value="myx">Lumasaba</option>
        <option value="lsm">Samia</option>
        <option value="nuj">Lunyole</option>
        <option value="gwr">Lugwere</option>
        <option value="rub">Lugungu</option>
        <option value="ruc">Ruruuli</option>
        <option value="mhi">Ma'di</option>
        <option value="alz">Alur</option>
        <option value="luc">Aringa</option>
        <option value="adh">Jopadhola</option>
        <option value="laj">Lango</option>
        <option value="kdj">Karamojong</option>
        <option value="pok">Pokot</option>
        <option value="keo">Kakwa</option>
        <option value="bfa">Bari</option>
        <option value="kdi">Kumam</option>
        <option value="kpz">Kupsabiny</option>
        <option value="rwm">Kwamba</option>
        <option value="tlj">Lubwisi</option>
      </select>

      <button id="swapBtn" title="Swap languages">&#8646;</button>

      <select id="tgtLang">
        <option value="lug">Luganda</option>
        <option value="eng">English</option>
        <option value="swa">Swahili</option>
        <option value="nyn">Runyankole</option>
        <option value="kin">Kinyarwanda</option>
        <option value="ach">Acholi</option>
        <option value="teo">Ateso</option>
        <option value="lgg">Lugbara</option>
        <option value="xog">Lusoga</option>
        <option value="ttj">Rutooro</option>
        <option value="nyo">Runyoro</option>
        <option value="cgg">Rukiga</option>
        <option value="koo">Rukonjo</option>
        <option value="myx">Lumasaba</option>
        <option value="lsm">Samia</option>
        <option value="nuj">Lunyole</option>
        <option value="gwr">Lugwere</option>
        <option value="rub">Lugungu</option>
        <option value="ruc">Ruruuli</option>
        <option value="mhi">Ma'di</option>
        <option value="alz">Alur</option>
        <option value="luc">Aringa</option>
        <option value="adh">Jopadhola</option>
        <option value="laj">Lango</option>
        <option value="kdj">Karamojong</option>
        <option value="pok">Pokot</option>
        <option value="keo">Kakwa</option>
        <option value="bfa">Bari</option>
        <option value="kdi">Kumam</option>
        <option value="kpz">Kupsabiny</option>
        <option value="rwm">Kwamba</option>
        <option value="tlj">Lubwisi</option>
      </select>
    </div>

    <div class="box">
      <textarea id="inputText" rows="3" placeholder="Type or speak here..."></textarea>
      <div class="box-actions">
        <button id="micBtn" title="Speak">&#127908;</button>
      </div>
    </div>

    <button id="translateBtn" class="primary-btn">Translate</button>
    <p id="errorMsg" class="error"></p>

    <div class="box output-box">
      <p id="outputText" class="placeholder">Translation will appear here</p>
      <span id="qualityLabel" class="quality-label" style="display:none;">Beta language - quality may vary</span>
      <div class="box-actions">
        <button id="copyBtn" title="Copy">&#128203;</button>
      </div>
    </div>

    <button id="logoutBtn" class="logout-link">Log out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<script src="auth.js"></script>
<script src="offline-phrases.js"></script>
<script src="app.js"></script>
</body>
</html>
